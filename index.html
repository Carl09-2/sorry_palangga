<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Will you be my Valentine? 💖</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #ffe6f0 0%, #ffb3c6 100%);
      position: fixed;
      width: 100%;
      height: 100%;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* floating heart balloon */
    .heart-balloon {
      position: fixed;
      width: 72px;
      height: 72px;
      pointer-events: none;
      z-index: 5;
      animation: floatHeart 16s infinite ease-in-out alternate;
      filter: drop-shadow(0 6px 10px rgba(230, 0, 80, 0.3));
      will-change: top, left, transform;
    }

    .heart-balloon svg {
      width: 100%;
      height: 100%;
      display: block;
      animation: beat 1.8s infinite ease-in-out;
      will-change: transform;
    }

    @keyframes floatHeart {
      0%   { top: 10%; left: 6%;  transform: rotate(-8deg) scale(1); }
      25%  { top: 72%; left: 14%; transform: rotate(6deg) scale(1.05); }
      50%  { top: 14%; left: 80%; transform: rotate(12deg) scale(1); }
      75%  { top: 78%; left: 72%; transform: rotate(-4deg) scale(0.96); }
      100% { top: 12%; left: 42%; transform: rotate(-10deg) scale(1.02); }
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      30%      { transform: scale(1.1); }
      60%      { transform: scale(0.96); }
    }

    /* main card */
    .container {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 2.4rem 1.8rem;
      border-radius: 48px;
      box-shadow: 0 22px 40px -12px rgba(200, 0, 70, 0.45),
                  0 0 0 2px rgba(255, 255, 255, 0.65) inset;
      text-align: center;
      max-width: 560px;
      width: calc(100% - 2.5rem);
      margin: 0 auto;
      transition: transform 0.25s ease;
      border: 2px solid rgba(255, 240, 245, 0.9);
      position: relative;
      z-index: 20;
    }

    h1 {
      font-size: clamp(1.7rem, 6vw, 2.6rem);
      font-weight: 700;
      color: #b3004b;
      text-shadow: 1px 1px 0 #ffccdd, 3px 3px 14px rgba(255, 80, 120, 0.3);
      margin-bottom: 0.8rem;
      line-height: 1.2;
      word-break: break-word;
    }

    .question-text {
      font-size: clamp(1.5rem, 5.5vw, 2.1rem);
      font-weight: 600;
      color: #7a1f3b;
      margin-bottom: 2rem;
      background: rgba(255, 220, 235, 0.75);
      display: inline-block;
      padding: 0.4rem 1.6rem;
      border-radius: 100px;
      box-shadow: 0 6px 0 #d94f7a;
      transform: rotate(-1deg);
      border: 1px solid #ff99bb;
      max-width: 100%;
    }

    .button-group {
      display: flex;
      gap: 1.4rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    button {
      border: none;
      padding: 0.9rem 2.2rem;
      font-size: clamp(1.2rem, 4.5vw, 1.6rem);
      font-weight: 700;
      border-radius: 60px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 7px 0 rgba(0, 0, 0, 0.1), 0 8px 20px rgba(220, 0, 90, 0.25);
      letter-spacing: 0.5px;
      border: 2px solid white;
      min-width: 120px;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      flex: 0 1 auto;
    }

    .yes-btn {
      background: #ff3b6f;
      color: white;
      text-shadow: 0 2px 0 #b3004b;
    }

    .yes-btn:active {
      transform: translateY(4px) scale(0.98);
      box-shadow: 0 3px 0 #b3004b, 0 6px 12px #ff80aa;
    }

    .no-btn {
      background: #ffe2ec;
      color: #a12b4a;
      text-shadow: 0 2px 0 #ffb6c9;
      box-shadow: 0 7px 0 #c27a92, 0 8px 20px rgba(200, 80, 120, 0.25);
      position: relative;
      will-change: left, top, transform;
    }

    .no-btn:active {
      transform: translateY(4px) scale(0.98);
    }

    /* final message area */
    .message-box {
      margin-top: 1.6rem;
      background: #fff2f7;
      border-radius: 40px;
      padding: 1.2rem 1rem;
      font-size: clamp(1rem, 3.8vw, 1.25rem);
      font-weight: 500;
      color: #a12b4a;
      border: 3px dashed #ff80a2;
      box-shadow: inset 0 0 20px #ffc0d0, 0 8px 18px #ffb6c9;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      line-height: 1.5;
      word-break: break-word;
    }

    .message-box.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .hotel-highlight {
      font-weight: 800;
      color: #c4004b;
      background: #ffe2ec;
      padding: 0.15rem 0.7rem;
      border-radius: 40px;
      display: inline-block;
      margin: 0.15rem 0;
    }

    .message-box .big-msg {
      font-size: clamp(1.3rem, 5vw, 1.7rem);
      margin-bottom: 0.3rem;
      font-weight: 700;
    }

    .message-box .sub-msg {
      font-size: clamp(1rem, 3.6vw, 1.15rem);
    }

    /* small height screens (landscape phones) */
    @media (max-height: 620px) {
      .container {
        padding: 1.4rem 1rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.4rem;
      }
      .question-text {
        font-size: 1.3rem;
        margin-bottom: 1.2rem;
        padding: 0.2rem 1rem;
      }
      button {
        padding: 0.6rem 1.5rem;
        font-size: 1.1rem;
        min-width: 100px;
      }
      .message-box {
        margin-top: 0.8rem;
        padding: 0.8rem 0.5rem;
      }
    }

    /* very small width */
    @media (max-width: 380px) {
      .button-group {
        gap: 0.8rem;
      }
      button {
        padding: 0.7rem 1.4rem;
        min-width: 100px;
      }
    }

    /* disable hover effects on touch devices */
    @media (hover: hover) and (pointer: fine) {
      .yes-btn:hover {
        background: #ff1a55;
        transform: scale(1.04);
        box-shadow: 0 6px 0 #b3004b, 0 12px 24px #ff80aa;
      }
      .no-btn:hover {
        background: #ffd0df;
      }
    }
  </style>
</head>
<body>

  <!-- floating heart balloon -->
  <div class="heart-balloon" id="heartBalloon" aria-hidden="true">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 88C50 88 8 58 8 32C8 16 20 6 34 6C43 6 50 13 50 13C50 13 57 6 66 6C80 6 92 16 92 32C92 58 50 88 50 88Z" fill="#FF3B6F" stroke="#FFD9E6" stroke-width="4"/>
      <ellipse cx="34" cy="30" rx="8" ry="6" fill="white" fill-opacity="0.4" transform="rotate(-20 34 30)"/>
      <ellipse cx="64" cy="26" rx="6" ry="4" fill="white" fill-opacity="0.3" transform="rotate(15 64 26)"/>
    </svg>
  </div>

  <div class="container" id="mainContainer">
    <h1>💘 hmmmmmm</h1>
    <div class="question-text">CLICK MY FAV EMOJI</div>

    <div class="button-group">
        <button class="yes-btn" id="yesBtn" type="button">😢</button>
        <button class="no-btn" id="noBtn" type="button">💋</button>
    </div>

    <!-- message shown after YES -->
    <div class="message-box" id="messageBox">
      <div class="big-msg">💕 SORRY PALANGGA 💕</div>
      <div class="sub-msg">sorry kaayu gabie palangga ha</div>
      <div><span class="hotel-highlight">🏨I LOVE YOU SO MUCH</span></div>
      <div>and <span class="hotel-highlight">I MISS YOU SO MUCH</span> 💋</div>
      <div class="sub-msg" style="margin-top:0.6rem;">❤️ ayaw e judge kay nag practice pako ❤️</div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');
      const messageBox = document.getElementById('messageBox');
      const container = document.getElementById('mainContainer');

      let isMessageShown = false;
      let dodgeCooldown = 0;

      // Get safe viewport bounds accounting for button size
      function getSafeBounds(btn) {
        const rect = btn.getBoundingClientRect();
        const btnW = rect.width || 120;
        const btnH = rect.height || 60;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const margin = 16;

        return {
          minLeft: margin,
          maxLeft: Math.max(margin, vw - btnW - margin),
          minTop: margin,
          maxTop: Math.max(margin, vh - btnH - margin),
          btnW,
          btnH,
          vw,
          vh
        };
      }

      // Move the "No" button to a random safe location
      function dodgeNoButton() {
        if (isMessageShown) return;

        // throttle to avoid too many moves per second (touch devices fire many events)
        const now = Date.now();
        if (now - dodgeCooldown < 80) return;
        dodgeCooldown = now;

        const bounds = getSafeBounds(noBtn);
        const left = Math.floor(Math.random() * (bounds.maxLeft - bounds.minLeft + 1)) + bounds.minLeft;
        const top = Math.floor(Math.random() * (bounds.maxTop - bounds.minTop + 1)) + bounds.minTop;
        const rot = (Math.random() * 24) - 12;

        // switch to fixed positioning once
        if (noBtn.style.position !== 'fixed') {
          noBtn.style.position = 'fixed';
          noBtn.style.margin = '0';
          noBtn.style.zIndex = '9999';
          noBtn.style.transition = 'left 0.16s ease, top 0.16s ease, transform 0.18s ease';
        }

        noBtn.style.left = left + 'px';
        noBtn.style.top = top + 'px';
        noBtn.style.transform = `rotate(${rot}deg)`;
      }

      // --- Attach dodge events for No button (all input types) ---

      // mouse / trackpad
      noBtn.addEventListener('mouseenter', dodgeNoButton);
      noBtn.addEventListener('mousemove', function(e) {
        if (Math.random() > 0.55) dodgeNoButton();
      });

      // touch
      noBtn.addEventListener('touchstart', function(e) {
        e.preventDefault();
        dodgeNoButton();
      }, { passive: false });

      noBtn.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (Math.random() > 0.6) dodgeNoButton();
      }, { passive: false });

      // click (desktop or if touch somehow triggers a click)
      noBtn.addEventListener('click', function(e) {
        e.preventDefault();
        dodgeNoButton();
      });

      // keyboard accessibility
      noBtn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          dodgeNoButton();
        }
      });

      // Avoid the button jumping on initial page load if the pointer is already on it
      window.addEventListener('load', function() {
        // Reset any fixed positioning from a previous session (e.g., back navigation)
        if (noBtn.style.position === 'fixed') {
          noBtn.style.position = '';
          noBtn.style.left = '';
          noBtn.style.top = '';
          noBtn.style.transform = '';
          noBtn.style.margin = '';
          noBtn.style.zIndex = '';
          noBtn.style.transition = '';
        }
      });

      // --- Yes button ---
      yesBtn.addEventListener('click', function() {
        if (isMessageShown) return;
        isMessageShown = true;

        messageBox.classList.add('show');

        // Hide the no button smoothly
        noBtn.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
        noBtn.style.opacity = '0';
        noBtn.style.pointerEvents = 'none';
        setTimeout(() => {
          noBtn.style.display = 'none';
        }, 280);

        yesBtn.textContent = ' HYSST (MALIII) PERO';
        yesBtn.disabled = true;
        yesBtn.style.opacity = '0.95';
        yesBtn.style.cursor = 'default';

        // little pop
        container.style.transform = 'scale(1.02)';
        setTimeout(() => {
          container.style.transform = 'scale(1)';
        }, 200);
      });

      // Prevent pinch-zoom double-tap zoom on the whole page (already via viewport, but extra)
      document.addEventListener('dblclick', function(e) {
        e.preventDefault();
      }, { passive: false });

      // Also, avoid the "No" button staying fixed if the user rotates the device
      // (reposition it to a safe spot if it's fixed and visible)
      window.addEventListener('orientationchange', function() {
        if (noBtn.style.position === 'fixed' && !isMessageShown && noBtn.style.display !== 'none') {
          const bounds = getSafeBounds(noBtn);
          const left = Math.min(Math.max(bounds.minLeft, parseInt(noBtn.style.left) || bounds.minLeft), bounds.maxLeft);
          const top  = Math.min(Math.max(bounds.minTop,  parseInt(noBtn.style.top)  || bounds.minTop),  bounds.maxTop);
          noBtn.style.left = left + 'px';
          noBtn.style.top  = top  + 'px';
        }
      });
    })();
  </script>
</body>
</html>
